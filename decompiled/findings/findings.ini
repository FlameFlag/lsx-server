# source_file, not the setup installer, unless source_file explicitly names
# decompiled/local/installers/Lemonade Tycoon 2 - New York City.exe.
# Extracted Armadillo runtime DLL findings target the concrete .pdata asset
# under decompiled/local/pdata_assets/.
